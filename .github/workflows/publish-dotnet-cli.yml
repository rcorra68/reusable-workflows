on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
      runtimes:
        required: true
        type: string   # es. '["linux-x64"]' oppure '["linux-x64","win-x64"]'
      artifact_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.version }}
      tag: ${{ steps.nbgv.outputs.tag }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Get version from version.json
        id: nbgv
        run: |
          VERSION=$(dotnet tool run nbgv -- get-version -v NuGetPackageVersion)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.nbgv.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag -a "${{ steps.nbgv.outputs.tag }}" -m "Release ${{ steps.nbgv.outputs.tag }}"
          git push origin "${{ steps.nbgv.outputs.tag }}"

      - name: Generate CHANGELOG.md
        if: steps.check_tag.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.nbgv.outputs.tag }} -o CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${{ steps.nbgv.outputs.tag }}" || echo "Nothing to commit"
          git push origin main

      - name: Extract release notes
        if: steps.check_tag.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header -o RELEASE_NOTES.md

      - name: Upload release notes
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    needs: tag
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: ${{ fromJson(inputs.runtimes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          dotnet publish "${{ inputs.project_path }}" \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o out-${{ matrix.rid }} \
            /p:PublishSingleFile=true

      - name: Package for release
        run: |
          cd out-${{ matrix.rid }}
          zip -r "../${{ inputs.artifact_name }}-${{ needs.tag.outputs.tag }}-${{ matrix.rid }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ needs.tag.outputs.tag }}-${{ matrix.rid }}
          path: "${{ inputs.artifact_name }}-${{ needs.tag.outputs.tag }}-${{ matrix.rid }}.zip"

  release:
    needs: [tag, build]
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        run: |
          gh release create "${{ needs.tag.outputs.tag }}" \
            artifacts/${{ inputs.artifact_name }}-${{ needs.tag.outputs.tag }}-*/*.zip \
            --title "${{ needs.tag.outputs.tag }}" \
            --notes-file artifacts/release-notes/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
