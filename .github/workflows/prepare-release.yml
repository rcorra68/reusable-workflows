on:
  workflow_call:
    inputs:
      solution_path:
        required: false
        type: string
        default: "."
      base_branch:
        required: false
        type: string
        default: "main"
      release_branch_prefix:
        required: false
        type: string
        default: "release"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      dotnet_version:
        required: false
        type: string
        default: "8.0.x"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s%n%b")

          if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\(.+\))?!:|BREAKING CHANGE:'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^fix(\(.+\))?:'; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "No release-relevant commits since $LATEST_TAG. Skipping release."
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Compute next version
        id: version
        if: steps.bump.outputs.bump != 'none'
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.bump }}" in
            major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR+1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set version in version.json
        if: steps.bump.outputs.bump != 'none'
        run: dotnet tool run nbgv -- set-version ${{ steps.version.outputs.version }}

      - name: Build and Test
        if: steps.bump.outputs.bump != 'none'
        run: |
          dotnet restore "${{ inputs.solution_path }}"
          dotnet build "${{ inputs.solution_path }}" --configuration Release --no-restore
          dotnet test "${{ inputs.solution_path }}" --configuration Release --no-build

      - name: Create or update release branch
        if: steps.bump.outputs.bump != 'none'
        run: |
          BRANCH_NAME="${{ inputs.release_branch_prefix }}/${{ steps.version.outputs.version }}"
          git checkout -B "$BRANCH_NAME"
          git add version.json
          git commit -m "chore(release): set version to ${{ steps.version.outputs.version }}"
          git push origin "$BRANCH_NAME" --force

      - name: Generate CHANGELOG preview (not committed)
        if: steps.bump.outputs.bump != 'none'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }} --unreleased --strip header -o CHANGELOG_PREVIEW.md

      - name: Create or update PR
        if: steps.bump.outputs.bump != 'none'
        run: |
          BRANCH_NAME="${{ inputs.release_branch_prefix }}/${{ steps.version.outputs.version }}"
          EXISTING_PR=$(gh pr list --base "${{ inputs.base_branch }}" --head "$BRANCH_NAME" --json number --jq '.[0].number')
          PREVIEW=$(cat CHANGELOG_PREVIEW.md)

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, skipping creation."
          else
            gh pr create \
              --base "${{ inputs.base_branch }}" \
              --head "$BRANCH_NAME" \
              --title "chore(release): v${{ steps.version.outputs.version }}" \
              --body "🚀 **Anteprima release**

          - **Versione prevista:** ${{ steps.version.outputs.version }}
          - **Tipo di bump:** ${{ steps.bump.outputs.bump }}

          ### Changelog
          $PREVIEW

          Il tag effettivo, il CHANGELOG.md definitivo e la pubblicazione del binario vengono creati automaticamente al merge di questa PR su \`${{ inputs.base_branch }}\`."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
